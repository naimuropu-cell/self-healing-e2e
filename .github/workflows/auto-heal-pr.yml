name: Nightly Auto-Heal & PR Bot

on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force heal patch and PR creation check'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-heal-pr:
    name: Execute Tests & Open Auto-Heal PR
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Target App Dependencies
        run: npm --prefix app ci

      - name: Install E2E Test Dependencies
        run: npm --prefix tests ci

      - name: Install Playwright Chromium with OS Dependencies
        run: npx --prefix tests playwright install --with-deps chromium

      - name: Build Target Application
        run: npm run app:build

      - name: Run Playwright Test Suite
        # Allow completion even if tests trigger self-healing
        run: npm test

      - name: Apply Auto-Patcher to Page Objects
        run: npm run heal:apply

      - name: Check for Stale Selector Modifications
        id: git-check
        run: |
          CHANGES=$(git status --porcelain tests/pages)
          if [ -n "$CHANGES" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Modified files detected in tests/pages:"
            echo "$CHANGES"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No stale selectors or Page Object changes detected."
          fi

      - name: Generate PR Description Body
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          cat << 'EOF' > pr_description.md
          ## 🛠️ Autonomous Self-Healing Locator Maintenance

          The scheduled autonomous self-healing test engine detected stale or deprecated element locators during test execution and successfully verified fallback locators against the active application DOM.

          ### 📋 Summary of Changes
          - Automatically patched outdated selectors inside `tests/pages/` to point directly to working, resilient locators.
          - Replaced failing primary selectors with verified DOM attributes.

          ### 🚀 Benefits of Merging
          - **Zero Latency**: Eliminates fallback evaluation delay on subsequent CI/CD test runs.
          - **Resilience**: Prevents test breakages due to ongoing frontend DOM evolutions.
          - **Living Page Objects**: Keeps Page Object Models synchronized with active front-end code.

          ---
          *Automated PR generated by the \`self-healing-e2e\` autonomous QA pipeline.*
          EOF

      - name: Create Pull Request
        if: steps.git-check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(auto-heal): permanently patch stale selectors in Page Objects'
          title: 'chore(auto-heal): update stale selectors in Page Objects'
          body-path: pr_description.md
          branch: auto-heal/nightly-maintenance
          base: main
          labels: |
            self-healing
            automated-pr
            qa-maintenance
          delete-branch: true

      - name: Display Self-Healing Audit Summary
        if: always()
        run: npm run heal:report

      - name: Publish GitHub Actions Job Summary
        if: always()
        run: node tests/utils/ci-summary.js

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-nightly
          path: tests/playwright-report/
          retention-days: 14

      - name: Upload Test Results & Healing Ledger
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-nightly
          path: tests/test-results/
          retention-days: 14
